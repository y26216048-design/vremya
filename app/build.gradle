plugins { id 'com.android.application' }
android {
    namespace 'ru.barakah.focus'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.barakah.focus'
        minSdk 28
        targetSdk 35
        versionCode 10
        versionName '0.10'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
}
